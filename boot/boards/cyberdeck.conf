CONFIG_PB_CHARGER=n
CONFIG_PB_FIRMWARE_NRF52=y

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PULSE_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_PRINTK=n

# USB DFU writes pblboot-headered payloads into external firmware scratch.
CONFIG_PB_FIRMWARE_NRF52_STAGED_UPDATE=y
CONFIG_PB_USB_DFU=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_VID=0xcafe
CONFIG_USB_DEVICE_PID=0x4002
CONFIG_USB_DEVICE_MANUFACTURER="Core Devices"
CONFIG_USB_DEVICE_PRODUCT="Cyberdeck Bootloader DFU"
CONFIG_USB_DEVICE_SN="123456"
CONFIG_USB_REQUEST_BUFFER_SIZE=256
CONFIG_USB_SELF_POWERED=n
CONFIG_USB_MAX_POWER=50
CONFIG_USB_DEVICE_BOS=n
CONFIG_REBOOT=y
CONFIG_MULTITHREADING=y
CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y

# Reserve 0x20000000..0x200000ff for the firmware-compatible retained bootbits.
CONFIG_SRAM_BASE_ADDRESS=0x20000100
CONFIG_SRAM_SIZE=255
