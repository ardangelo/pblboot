CONFIG_PB_CHARGER=n
CONFIG_PB_FIRMWARE_NRF52=y

# The nRF52 watchdog cannot be stopped once started, and the nRF52 firmware
# does not adopt/feed a bootloader-started watchdog in time, so starting it in
# the bootloader causes a reset loop. Install but do not autostart it.
CONFIG_PB_WATCHDOG_AUTOSTART=n

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PULSE_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_PRINTK=n

# Staged firmware updates from external flash are kept.
CONFIG_PB_FIRMWARE_NRF52_STAGED_UPDATE=y

# USB DFU is disabled for now: the legacy USB device stack adds ~13K, pushing
# the bootloader past the 32K boot partition. The firmware is pinned at 0x8000
# (it is not relocatable to grow the partition), so DFU does not fit. Staged
# updates above still provide a flash-based firmware update path.
CONFIG_PB_USB_DFU=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_REBOOT=y
CONFIG_MULTITHREADING=y
CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y

# Reserve 0x20000000..0x200000ff for the firmware-compatible retained bootbits.
CONFIG_SRAM_BASE_ADDRESS=0x20000100
CONFIG_SRAM_SIZE=255
