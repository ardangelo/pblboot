adapter driver ftdi
transport select swd

ftdi vid_pid 0x0403 0x6010
ftdi device_desc "Tigard V1.1"
ftdi channel 1
ftdi layout_init 0x0038 0x003b
ftdi layout_signal SWD_EN -data 0

adapter speed 2000

source [find target/nrf52.cfg]

reset_config none
